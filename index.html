  <style>
    :root {
      --ink: #0a0c0d;
      --panel: #121517;
      --panel-2: #171b1d;
      --line: rgba(237, 237, 230, 0.10);
      --line-strong: rgba(237, 237, 230, 0.18);
      --ivory: #EDEDE6;
      --steel: #9aa3a7;
      --steel-dim: #6b7377;
      --teal: #4fb8a6;
      --teal-bright: #8fe9d8;
      --teal-dim: rgba(79, 184, 166, 0.14);
      --teal-line: rgba(79, 184, 166, 0.35);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    /* Hanya sembunyikan cursor default jika bukan touch device */
    @media (hover: hover) and (pointer: fine) {
      html, body {
        cursor: none;
      }
    }

    body {
      margin: 0;
      background: var(--ink);
      color: var(--ivory);
      font-family: 'Manrope', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* Custom cursor styles - hanya muncul di desktop */
    @media (hover: hover) and (pointer: fine) {
      .cursor-dot {
        position: fixed;
        top: 0;
        left: 0;
        width: 8px;
        height: 8px;
        background: var(--teal-bright);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 15px var(--teal), 0 0 30px var(--teal-dim);
        transition: width 0.15s ease, height 0.15s ease, background 0.15s ease;
        mix-blend-mode: difference;
      }

      .cursor-ring {
        position: fixed;
        top: 0;
        left: 0;
        width: 32px;
        height: 32px;
        border: 1.5px solid var(--teal-line);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9998;
        transform: translate(-50%, -50%);
        transition: width 0.2s ease, height 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        background: transparent;
      }
    }

    /* Sembunyikan cursor di mobile */
    @media (hover: none) and (pointer: coarse) {
      .cursor-dot, .cursor-ring {
        display: none !important;
      }
    }

    /* Efek klik: ripple */
    .click-ripple {
      position: fixed;
      border-radius: 50%;
      border: 1px solid var(--teal-bright);
      background: rgba(79, 184, 166, 0.15);
      pointer-events: none;
      z-index: 9997;
      animation: rippleEffect 0.8s ease-out forwards;
    }

    @keyframes rippleEffect {
      0% {
        width: 0;
        height: 0;
        opacity: 1;
        transform: translate(-50%, -50%) scale(0);
      }
      100% {
        width: 120px;
        height: 120px;
        opacity: 0;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* Partikel kecil saat klik */
    .click-particle {
      position: fixed;
      width: 4px;
      height: 4px;
      background: var(--teal-bright);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9996;
      box-shadow: 0 0 8px var(--teal);
      animation: particleBurst 0.7s ease-out forwards;
    }

    @keyframes particleBurst {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0);
      }
    }

    ::selection {
      background: var(--teal-dim);
      color: var(--teal-bright);
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: var(--ink);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--panel-2);
      border-radius: 10px;
      border: 2px solid var(--ink);
    }

    html {
      scrollbar-color: var(--panel-2) var(--ink);
    }

    /* ---------- Atmospheric background ---------- */
    .fog {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(60% 45% at 18% 12%, rgba(120, 130, 132, 0.16), transparent 60%),
        radial-gradient(55% 40% at 85% 20%, rgba(79, 184, 166, 0.09), transparent 65%),
        radial-gradient(70% 55% at 50% 100%, rgba(90, 95, 98, 0.14), transparent 60%),
        linear-gradient(180deg, #0b0e0f 0%, #0a0c0d 45%, #08090a 100%);
      background-size: 200% 200%, 200% 200%, 200% 200%, 100% 100%;
      animation: fogDrift 34s ease-in-out infinite alternate;
    }

    @keyframes fogDrift {
      0% { background-position: 0% 0%, 100% 0%, 50% 100%, 0 0; }
      100% { background-position: 15% 10%, 80% 15%, 40% 90%, 0 0; }
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.05;
      mix-blend-mode: overlay;
    }

    .particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .mote {
      position: absolute;
      bottom: -10px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--steel);
      opacity: 0;
      animation-name: rise;
      animation-timing-function: ease-in;
      animation-iteration-count: infinite;
    }

    .mote.teal {
      background: var(--teal);
      box-shadow: 0 0 6px var(--teal);
    }

    @keyframes rise {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: .55; }
      90% { opacity: .25; }
      100% { transform: translateY(-110vh) translateX(var(--drift, 20px)); opacity: 0; }
    }

    /* ---------- Layout ---------- */
    main.card {
      position: relative;
      z-index: 2;
      max-width: 460px;
      margin: 0 auto;
      padding: 72px 28px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------- Hero ---------- */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .pfp-wrap {
      position: relative;
      width: 132px;
      height: 132px;
      margin-bottom: 26px;
      opacity: 0;
      animation: fadeRise .8s ease-out .05s forwards;
    }

    .pfp-ring {
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      border: 1px solid var(--teal-line);
      box-shadow: 0 0 0 1px var(--line), 0 0 26px 2px var(--teal-dim);
      animation: ringPulse 4.5s ease-in-out infinite;
    }

    @keyframes ringPulse {
      0%, 100% { box-shadow: 0 0 0 1px var(--line), 0 0 18px 0px var(--teal-dim); }
      50% { box-shadow: 0 0 0 1px var(--line), 0 0 34px 4px var(--teal-dim); }
    }

    .pfp {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      filter: saturate(0.85) contrast(1.03);
      border: 1px solid rgba(0, 0, 0, 0.4);
    }

    .status-dot {
      position: absolute;
      right: 4px;
      bottom: 6px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--teal);
      border: 3px solid var(--ink);
      box-shadow: 0 0 10px var(--teal);
    }

    .moth {
      position: absolute;
      top: -14px;
      right: -20px;
      width: 40px;
      height: 40px;
      transform: rotate(8deg);
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
    }

    .moth .wings {
      transform-origin: 20px 20px;
      animation: flutter 1.6s ease-in-out infinite;
    }

    @keyframes flutter {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.72); }
    }

    .name {
      font-family: 'Marcellus', serif;
      font-weight: 400;
      font-size: 2.5rem;
      letter-spacing: 0.01em;
      margin: 0 0 10px;
      color: var(--ivory);
      opacity: 0;
      animation: fadeRise .8s ease-out .16s forwards;
    }

    /* Hanya sembunyikan cursor di desktop */
    @media (hover: hover) and (pointer: fine) {
      .handle, .social, button {
        cursor: none;
      }
    }

    .handle {
      appearance: none;
      border: none;
      background: transparent;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-family: 'Space Mono', monospace;
      font-size: 0.92rem;
      color: var(--steel);
      padding: 4px 6px;
      border-radius: 6px;
      transition: color .2s ease, background .2s ease;
      opacity: 0;
      animation: fadeRise .8s ease-out .26s forwards;
    }

    .handle .at-sign {
      font-family: 'Marcellus', serif;
      font-size: 1.15rem;
      font-weight: 400;
      color: var(--teal);
      transition: color 0.2s ease;
      line-height: 1;
      margin-right: 1px;
    }

    .handle .username-text {
      font-family: 'Space Mono', monospace;
      font-size: 0.92rem;
      color: inherit;
    }

    .handle:hover {
      color: var(--teal-bright);
      background: var(--teal-dim);
    }

    .handle:hover .at-sign {
      color: var(--teal-bright);
    }

    .handle:focus-visible {
      outline: 1.5px solid var(--teal);
      outline-offset: 2px;
    }

    .handle svg {
      width: 13px;
      height: 13px;
      opacity: 0.7;
    }

    .tagline {
      font-family: 'Marcellus', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--steel);
      margin: 18px 0 0;
      max-width: 320px;
      line-height: 1.5;
      opacity: 0;
      animation: fadeRise .8s ease-out .36s forwards;
    }

    @keyframes fadeRise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Sections ---------- */
    .section {
      width: 100%;
      margin-top: 52px;
      opacity: 0;
      animation: fadeRise .8s ease-out forwards;
    }

    .section.skills-section { animation-delay: .46s; }
    .section.social-section { animation-delay: .56s; }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--steel-dim);
      margin: 0 0 18px;
    }

    .eyebrow .tick {
      width: 16px;
      height: 1px;
      background: var(--teal-line);
      flex: none;
    }

    .eyebrow .tick.after {
      flex: 1 1 auto;
    }

    .eyebrow-line {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    /* Skills */
    .skills {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .skill {
      display: flex;
      align-items: center;
      gap: 13px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      transition: border-color .2s ease, transform .2s ease;
    }

    .skill:hover {
      border-color: var(--teal-line);
      transform: translateX(2px);
    }

    .skill-text {
      font-family: 'Manrope', sans-serif;
      font-weight: 600;
      font-size: 0.98rem;
      color: var(--ivory);
      letter-spacing: 0.01em;
    }

    .skill-text .ver {
      color: var(--teal-bright);
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      margin-left: 4px;
    }

    .badge {
      margin-left: auto;
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.03em;
      color: var(--steel);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line-strong);
      border-radius: 20px;
      padding: 4px 10px;
      white-space: nowrap;
    }

    /* Crack info */
    .crack-info {
      margin-top: 12px;
      padding: 0 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .crack-line {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      color: var(--steel-dim);
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.02em;
    }

    .crack-line .crack-label {
      color: var(--steel);
      opacity: 0.9;
    }

    .crack-value {
      color: var(--teal-bright);
      font-weight: 600;
      background: var(--teal-dim);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: auto;
    }

    .crack-value:hover {
      background: rgba(79, 184, 166, 0.25);
      border-color: var(--teal-line);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(79, 184, 166, 0.2);
    }

    .crack-divider {
      width: 100%;
      height: 1px;
      background: var(--line);
      margin: 6px 0 2px;
    }

    /* Socials */
    .socials {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .social {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px 16px;
      text-decoration: none;
      color: inherit;
      font: inherit;
      text-align: left;
      width: 100%;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
      position: relative;
      overflow: hidden;
    }

    .social:hover {
      border-color: var(--teal-line);
      background: var(--panel-2);
      transform: translateX(3px);
    }

    .social:focus-visible {
      outline: 1.5px solid var(--teal);
      outline-offset: 2px;
    }

    .social-icon {
      width: 36px;
      height: 36px;
      flex: none;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      color: var(--steel);
      transition: color .2s ease, border-color .2s ease;
    }

    .social:hover .social-icon {
      color: var(--teal-bright);
      border-color: var(--teal-line);
    }

    .social-icon svg {
      width: 17px;
      height: 17px;
    }

    .social-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .social-label {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--steel-dim);
      font-family: 'Space Mono', monospace;
    }

    .social-handle {
      font-size: 0.95rem;
      color: var(--ivory);
      font-weight: 600;
    }

    .arrow {
      width: 15px;
      height: 15px;
      flex: none;
      color: var(--steel-dim);
      transition: transform .2s ease, color .2s ease;
    }

    .social:hover .arrow {
      transform: translateX(3px);
      color: var(--teal-bright);
    }

    /* Footer */
    .footer {
      width: 100%;
      text-align: center;
      margin-top: 52px;
      padding: 20px 0 0;
      opacity: 0;
      animation: fadeRise .8s ease-out .66s forwards;
    }

    .footer-text {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: var(--steel-dim);
      letter-spacing: 0.08em;
    }

    .footer-text .footer-name {
      color: var(--teal);
      font-weight: 600;
    }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 20px);
      background: var(--panel-2);
      border: 1px solid var(--teal-line);
      color: var(--ivory);
      font-family: 'Space Mono', monospace;
      font-size: 0.82rem;
      padding: 11px 18px;
      border-radius: 10px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 6px var(--teal);
      flex: none;
    }

    @media (max-width: 480px) {
      main.card { padding: 56px 22px 48px; }
      .name { font-size: 2.1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fog, .mote, .pfp-ring, .moth .wings, .click-ripple, .click-particle {
        animation: none !important;
      }
      .pfp-wrap, .name, .handle, .tagline, .section, .footer {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>

  <div class="toast" id="toast">
    <span class="dot"></span>
    <span id="toastText">Copied</span>
  </div>

  <script>
    (function() {
      // Deteksi apakah perangkat touch screen
      const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.matchMedia('(hover: none) and (pointer: coarse)').matches);
      
      // --- Ambient particles ---
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduceMotion) {
        var wrap = document.getElementById('particles');
        var count = 22;
        for (var i = 0; i < count; i++) {
          var m = document.createElement('div');
          m.className = 'mote' + (Math.random() < 0.28 ? ' teal' : '');
          var left = Math.random() * 100;
          var dur = 9 + Math.random() * 10;
          var delay = Math.random() * 14;
          var drift = (Math.random() * 40 - 20) + 'px';
          m.style.left = left + '%';
          m.style.setProperty('--drift', drift);
          m.style.animationDuration = dur + 's';
          m.style.animationDelay = delay + 's';
          wrap.appendChild(m);
        }
      }

      // --- Custom cursor (hanya untuk desktop) ---
      if (!isTouchDevice) {
        const cursorDot = document.getElementById('cursorDot');
        const cursorRing = document.getElementById('cursorRing');
        
        if (cursorDot && cursorRing) {
          cursorDot.style.display = 'block';
          cursorRing.style.display = 'block';
          
          let mouseX = window.innerWidth / 2;
          let mouseY = window.innerHeight / 2;
          let ringX = mouseX;
          let ringY = mouseY;

          document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorDot.style.left = mouseX + 'px';
            cursorDot.style.top = mouseY + 'px';
          });

          function animateRing() {
            ringX += (mouseX - ringX) * 0.2;
            ringY += (mouseY - ringY) * 0.2;
            cursorRing.style.left = ringX + 'px';
            cursorRing.style.top = ringY + 'px';
            requestAnimationFrame(animateRing);
          }
          animateRing();

          // Efek hover pada elemen interaktif
          const hoverTargets = document.querySelectorAll('a, button, .skill, .social, .handle, .crack-value');
          hoverTargets.forEach(el => {
            el.addEventListener('mouseenter', () => {
              cursorDot.style.width = '16px';
              cursorDot.style.height = '16px';
              cursorDot.style.background = 'var(--teal)';
              cursorRing.style.width = '48px';
              cursorRing.style.height = '48px';
              cursorRing.style.borderColor = 'var(--teal-bright)';
              cursorRing.style.background = 'rgba(79,184,166,0.08)';
            });
            el.addEventListener('mouseleave', () => {
              cursorDot.style.width = '8px';
              cursorDot.style.height = '8px';
              cursorDot.style.background = 'var(--teal-bright)';
              cursorRing.style.width = '32px';
              cursorRing.style.height = '32px';
              cursorRing.style.borderColor = 'var(--teal-line)';
              cursorRing.style.background = 'transparent';
            });
          });

          document.addEventListener('mouseleave', () => {
            cursorDot.style.opacity = '0';
            cursorRing.style.opacity = '0';
          });
          
          document.addEventListener('mouseenter', () => {
            cursorDot.style.opacity = '1';
            cursorRing.style.opacity = '1';
          });
        }
      } else {
        // Untuk touch device, pastikan cursor tidak muncul
        const cursorDot = document.getElementById('cursorDot');
        const cursorRing = document.getElementById('cursorRing');
        if (cursorDot) cursorDot.style.display = 'none';
        if (cursorRing) cursorRing.style.display = 'none';
      }

      // --- Efek klik (untuk semua perangkat) ---
      function createClickEffect(x, y) {
        const ripple = document.createElement('div');
        ripple.className = 'click-ripple';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        document.body.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove());

        const particleCount = 8;
        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement('div');
          particle.className = 'click-particle';
          particle.style.left = x + 'px';
          particle.style.top = y + 'px';
          const angle = (Math.PI * 2 * i) / particleCount;
          const distance = 25 + Math.random() * 30;
          const tx = Math.cos(angle) * distance + 'px';
          const ty = Math.sin(angle) * distance + 'px';
          particle.style.setProperty('--tx', tx);
          particle.style.setProperty('--ty', ty);
          document.body.appendChild(particle);
          particle.addEventListener('animationend', () => particle.remove());
        }
      }

      // Event klik untuk desktop dan touch
      document.addEventListener('click', (e) => {
        createClickEffect(e.clientX, e.clientY);
      });

      // Event touch khusus untuk mobile
      document.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length > 0) {
          const touch = e.touches[0];
          createClickEffect(touch.clientX, touch.clientY);
        }
      }, { passive: true });

      // --- Copy function ---
      function copyText(text, label) {
        var toast = document.getElementById('toast');
        var toastText = document.getElementById('toastText');
        function show() {
          toastText.textContent = label;
          toast.classList.add('show');
          clearTimeout(window.__toastTimer);
          window.__toastTimer = setTimeout(function() {
            toast.classList.remove('show');
          }, 2000);
        }
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(show).catch(show);
        } else {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch (e) {}
          document.body.removeChild(ta);
          show();
        }
      }

      document.getElementById('handleBtn').addEventListener('click', function(e) {
        e.stopPropagation();
        copyText('@Onlylayer6', 'Copied @Onlylayer6');
      });
      
      document.getElementById('discordBtn').addEventListener('click', function(e) {
        e.stopPropagation();
        copyText('@OnlyLayer6', 'Copied @OnlyLayer6 — paste it in Discord');
      });

    })();
  </script>
